<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}} | FreshFold Laundry</title>
  <!-- Tailwind CSS via the Play CDN (no build step needed) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">
  <header class="bg-white shadow-sm">
    <nav class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3 px-4 py-4">
      <a href="/home" class="text-2xl font-bold text-sky-600">🧺 FreshFold</a>
      <ul class="flex flex-wrap gap-5 text-sm">
        <li><a href="/home" class="hover:text-sky-600 {{nav_home}}">Home</a></li>
        <li><a href="/about" class="hover:text-sky-600 {{nav_about}}">About</a></li>
        <li><a href="/services" class="hover:text-sky-600 {{nav_services}}">Services</a></li>
        <li><a href="/pricing" class="hover:text-sky-600 {{nav_pricing}}">Pricing</a></li>
        <li><a href="/contact" class="hover:text-sky-600 {{nav_contact}}">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-10">
    {{content}}
  </main>

  <footer class="bg-slate-900 text-slate-300 text-sm">
    <div class="max-w-5xl mx-auto px-4 py-6 text-center">
      &copy; 2026 FreshFold Laundry &middot; Served by Node.js http module
    </div>
  </footer>
</body>
</html>
