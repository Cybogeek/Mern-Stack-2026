<section class="max-w-xl mx-auto">
  <h1 class="text-3xl font-bold text-slate-900">Contact Us</h1>
  <p class="mt-2 text-slate-600">Book a pickup or ask us anything.</p>
  <form method="POST" action="/contact" class="mt-6 space-y-4 rounded-xl bg-white p-6 shadow-sm">
    <div>
      <label for="name" class="block text-sm font-medium">Name</label>
      <input id="name" name="name" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500" />
    </div>
    <div>
      <label for="email" class="block text-sm font-medium">Email</label>
      <input id="email" name="email" type="email" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500" />
    </div>
    <div>
      <label for="message" class="block text-sm font-medium">Message</label>
      <textarea id="message" name="message" rows="4" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"></textarea>
    </div>
    <button type="submit" class="w-full rounded-lg bg-sky-600 py-2.5 font-medium text-white hover:bg-sky-700">Send Message</button>
  </form>
</section>
